{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In — OfficeHours</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}"/>
    <style>
        .select-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 52px 48px 48px;
            background: rgba(245, 240, 232, .97);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            animation: fadeUp .6s ease both;
            color: var(--ink);
        }

        .select-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .select-header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .select-header p {
            font-size: .875rem;
            color: var(--muted);
            font-weight: 300;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .choice-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 32px 20px;
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--ink);
            transition:
                border-color var(--transition-base),
                box-shadow var(--transition-base),
                transform var(--transition-base);
            animation: fadeUp .6s ease both;
        }

        .choice-btn:first-child { animation-delay: .1s; }
        .choice-btn:last-child  { animation-delay: .2s; }

        .choice-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(181, 65, 10, .08);
            transform: translateY(-2px);
            text-decoration: none;
            color: var(--ink);
        }

        .choice-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(181, 65, 10, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-base);
        }

        .choice-btn:hover .choice-icon {
            background: rgba(181, 65, 10, .16);
        }

        .choice-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .choice-label {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
        }

        .choice-sub {
            font-size: .75rem;
            color: var(--muted);
            font-weight: 300;
            text-align: center;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            .select-card { padding: 36px 24px 32px; }
            .choice-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="select-card">

        <div class="select-header">
            <h1>OfficeHours</h1>
            <p>Choose your account type to continue</p>
        </div>

        <div class="choice-grid">

            <a href="/staff/login" class="choice-btn">
                <div class="choice-icon">
                    <!-- Briefcase icon -->
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="7" width="20" height="14" rx="2"/>
                        <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                        <line x1="12" y1="12" x2="12" y2="12.01"/>
                    </svg>
                </div>
                <span class="choice-label">Staff</span>
                <span class="choice-sub">Instructors &amp; TAs</span>
            </a>

            <a href="/student/login/" class="choice-btn">
                <div class="choice-icon">
                    <!-- Graduation cap icon -->
                    <svg viewBox="0 0 24 24">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c0 1.657 2.686 3 6 3s6-1.343 6-3v-5"/>
                    </svg>
                </div>
                <span class="choice-label">Student</span>
                <span class="choice-sub">View office hours &amp; schedules</span>
            </a>

        </div>

    </div>

</body>
</html>
