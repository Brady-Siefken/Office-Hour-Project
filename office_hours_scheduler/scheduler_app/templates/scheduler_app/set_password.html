{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set Password — OfficeHours</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}"/>
</head>
<body>

    <div class="card">
        <a href="{% url 'student-login' %}" class="back-link back-arrow" aria-label="Back to login">←</a>
        <div class="form-header">
            <h2>Create a Password</h2>
            <p>Welcome, <strong>{{ student.name }}</strong>. Set a password to activate your account.</p>
        </div>

        {% if message %}
            <div class="form-error">{{ message }}</div>
        {% endif %}

        <form method="POST" action="/set/password/">
            {% csrf_token %}
            <input type="hidden" name="username" value="{{ student.username }}"/>

            <div class="field">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter a password" required/>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required/>
            </div>

            <button type="submit" class="btn-submit"><span>Set Password</span></button>
        </form>

    </div>

</body>
</html>
